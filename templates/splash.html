<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Senyasalin startup" />
  <title>Senyasalin</title>
  <style>
    :root {
      --ink: #0b1020;
      --panel: #131a33;
      --panel-soft: #1a2447;
      --accent: #5865f2;
      --accent-2: #4cc9f0;
      --white: #ffffff;
      --muted: #c5d0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #223066 0%, transparent 55%),
                  radial-gradient(900px 500px at 100% 100%, #152b63 0%, transparent 60%),
                  var(--ink);
      color: var(--white);
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      animation: pageIn 280ms ease-out;
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(60px);
      opacity: .28;
      animation: drift 6s ease-in-out infinite;
    }

    .orb.one {
      width: 320px;
      height: 320px;
      background: #5865f2;
      top: -80px;
      left: -40px;
    }

    .orb.two {
      width: 260px;
      height: 260px;
      background: #4cc9f0;
      right: -60px;
      bottom: -30px;
      animation-delay: 1.2s;
    }

    .card {
      width: min(560px, calc(100% - 40px));
      background: linear-gradient(180deg, rgba(26,36,71,.86), rgba(19,26,51,.86));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      padding: 34px 28px 24px;
      text-align: center;
      transform: translateY(8px);
      animation: cardUp 600ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    .logo-wrap {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      position: relative;
    }

    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 34px;
      border: 2px solid rgba(88,101,242,.55);
      animation: ping 1.6s ease-out infinite;
    }

    .logo-ring.two {
      animation-delay: .8s;
      border-color: rgba(76,201,240,.42);
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      animation: pop 560ms cubic-bezier(.2,.8,.2,1) both;
    }

    .title {
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 900;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ffffff, #cfd8ff 45%, #8fe8ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .2px;
      margin-bottom: 20px;
    }

    .loader {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #dbe2ff;
      animation: blink 900ms ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: .12s; }
    .dot:nth-child(3) { animation-delay: .24s; }

    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      overflow: hidden;
    }

    .bar > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: load 2200ms cubic-bezier(.2,.8,.2,1) forwards;
      box-shadow: 0 0 18px rgba(88,101,242,.5);
    }

    .hint {
      margin-top: 10px;
      color: #b9c4f7;
      font-size: 12px;
      font-weight: 700;
    }

    .splash.exit {
      animation: pageOut 320ms ease forwards;
    }

    @keyframes pageIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pageOut {
      to { opacity: 0; transform: scale(1.015); }
    }

    @keyframes cardUp {
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pop {
      0% { transform: scale(.84); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes ping {
      0% { transform: scale(.88); opacity: .8; }
      100% { transform: scale(1.14); opacity: 0; }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(12px, -10px); }
    }

    @keyframes blink {
      0%, 80%, 100% { transform: scale(.9); opacity: .45; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes load {
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splashRoot">
    <div class="ambient">
      <div class="orb one"></div>
      <div class="orb two"></div>
    </div>

    <section class="card" aria-label="Startup Screen">
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo-ring two"></div>
        <img class="logo" src="{{ url_for('static', filename='img/logo5.png') }}" alt="Senyasalin logo" />
      </div>
      <h1 class="title">Senyasalin</h1>
      <p class="subtitle">Filipino Sign Language Recognition System</p>

      <div class="loader" aria-hidden="true">
        <div class="dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div class="bar"><span></span></div>
      </div>
      <p class="hint">Starting up…</p>
    </section>
  </div>

  <script>
    (function() {
      const splash = document.getElementById('splashRoot');
      const HOLD_MS = 2300;
      const EXIT_MS = 260;

      setTimeout(function() {
        splash.classList.add('exit');
        setTimeout(function() {
          window.location.replace('{{ url_for("home") }}');
        }, EXIT_MS);
      }, HOLD_MS);
    })();
  </script>
</body>
</html>
