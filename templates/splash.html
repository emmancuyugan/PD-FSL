<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Senyasalin startup" />
  <title>Senyasalin</title>
  <style>
    :root {
      --sunshine: #FFD93D;
      --sky-blue: #4CC9F0;
      --grass-green: #06D6A0;
      --coral: #FF6B9D;
      --lavender: #A78BFA;
      --orange: #FF8C42;
      --deep-blue: #4361EE;
      --white: #FFFFFF;
      --ink: #1E293B;
      --shadow: rgba(67, 97, 238, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #E0F4FF 0%, #FFE5EC 50%, #FFF4E0 100%);
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      animation: pageIn 280ms ease-out;
      isolation: isolate;
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .shape {
      position: absolute;
      opacity: 0.22;
      animation: float 16s infinite ease-in-out;
      filter: saturate(1.05);
    }

    .shape:nth-child(1) {
      width: 210px;
      height: 210px;
      background: var(--sunshine);
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      top: -32px;
      left: -44px;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 170px;
      height: 170px;
      background: var(--coral);
      border-radius: 50%;
      top: 14%;
      right: -44px;
      animation-delay: 2.5s;
    }

    .shape:nth-child(3) {
      width: 230px;
      height: 230px;
      background: var(--grass-green);
      border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%;
      bottom: -64px;
      right: 10%;
      animation-delay: 5s;
    }

    .shape:nth-child(4) {
      width: 140px;
      height: 140px;
      background: var(--lavender);
      border-radius: 40% 60% 44% 56% / 67% 36% 64% 33%;
      left: 8%;
      bottom: 10%;
      animation-delay: 7.5s;
    }

    .card {
      z-index: 1;
      width: min(580px, calc(100% - 32px));
      background: rgba(255, 255, 255, 0.84);
      border: 2px solid rgba(67, 97, 238, 0.18);
      border-radius: 28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 36px var(--shadow);
      padding: 32px 26px 24px;
      text-align: center;
      transform: translateY(14px) scale(.98);
      opacity: 0;
      animation: cardIn 700ms cubic-bezier(.2,.8,.2,1) .08s forwards;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(76, 201, 240, 0.16), rgba(67, 97, 238, 0.16));
      color: var(--deep-blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .kicker::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--grass-green), var(--sky-blue));
      box-shadow: 0 0 0 6px rgba(6, 214, 160, 0.18);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .logo-wrap {
      width: 104px;
      height: 104px;
      margin: 0 auto 14px;
      border-radius: 28px;
      padding: 6px;
      background: linear-gradient(135deg, var(--deep-blue), var(--lavender), var(--coral));
      box-shadow: 0 12px 26px rgba(67, 97, 238, 0.28);
      animation: pop 560ms cubic-bezier(.2,.8,.2,1) .16s both;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      background: var(--white);
    }

    .title {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--deep-blue), var(--lavender), var(--coral));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #334155;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    .pill-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .pill {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      color: #1f2937;
      opacity: 0;
      transform: translateY(8px);
      animation: reveal 400ms ease forwards;
    }

    .pill:nth-child(1) {
      background: rgba(76, 201, 240, 0.25);
      border-color: rgba(67, 97, 238, 0.22);
      animation-delay: .22s;
    }

    .pill:nth-child(2) {
      background: rgba(6, 214, 160, 0.25);
      border-color: rgba(6, 214, 160, 0.32);
      animation-delay: .34s;
    }

    .pill:nth-child(3) {
      background: rgba(255, 107, 157, 0.18);
      border-color: rgba(255, 107, 157, 0.35);
      animation-delay: .46s;
    }

    .loader {
      width: 100%;
      max-width: 310px;
      margin: 0 auto;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(67, 97, 238, 0.14);
      overflow: hidden;
      border: 1px solid rgba(67, 97, 238, 0.22);
      position: relative;
    }

    .bar > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--deep-blue), var(--sky-blue), var(--grass-green));
      animation: load 2200ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    .bar > span::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 0;
      width: 80px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
      filter: blur(4px);
      animation: shimmer 1.4s linear infinite;
    }

    .hint {
      margin-top: 10px;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .splash.exit {
      animation: pageOut 320ms ease forwards;
    }

    @media (max-width: 640px) {
      .card {
        border-radius: 24px;
        padding: 26px 18px 18px;
      }

      .logo-wrap {
        width: 92px;
        height: 92px;
        border-radius: 22px;
      }

      .logo {
        border-radius: 16px;
      }

      .subtitle {
        font-size: 13px;
      }

      .shape:nth-child(1),
      .shape:nth-child(3) {
        opacity: 0.16;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @keyframes pageIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pageOut {
      to { opacity: 0; transform: scale(1.015); }
    }

    @keyframes cardIn {
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes pop {
      0% { transform: scale(.82) rotate(-4deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(12px, -10px) rotate(4deg); }
      50% { transform: translate(-10px, 10px) rotate(-5deg); }
      75% { transform: translate(10px, -6px) rotate(3deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.16); opacity: .75; }
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes load {
      to { width: 100%; }
    }

    @keyframes shimmer {
      from { transform: translateX(-90px); }
      to { transform: translateX(330px); }
    }
  </style>
</head>
<body>
  <div class="splash" id="splashRoot">
    <div class="ambient" aria-hidden="true">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <section class="card" aria-label="Startup Screen">
      <p class="kicker">Initializing Experience</p>

      <div class="logo-wrap">
        <img class="logo" src="{{ url_for('static', filename='img/logo5.png') }}" alt="Senyasalin logo" />
      </div>

      <h1 class="title">Senyasalin</h1>
      <p class="subtitle">Filipino Sign Language Recognition System</p>

      <div class="pill-row" aria-hidden="true">
        <span class="pill">Learn</span>
        <span class="pill">Practice</span>
        <span class="pill">Detect</span>
      </div>

      <div class="loader" aria-hidden="true">
        <div class="bar"><span></span></div>
      </div>
      <p class="hint">Preparing your learning space...</p>
    </section>
  </div>

  <script>
    (function() {
      const splash = document.getElementById('splashRoot');
      const HOLD_MS = 2300;
      const EXIT_MS = 260;

      setTimeout(function() {
        splash.classList.add('exit');
        setTimeout(function() {
          window.location.replace('{{ url_for("home") }}');
        }, EXIT_MS);
      }, HOLD_MS);
    })();
  </script>
</body>
</html>
